[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "threadline"
version = "0.4.0"
description = "Continue any project in any coding agent: Claude Code, Codex, Cursor and more, from one local history"
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
# zstd compresses the journal and reads Codex's compressed history.
dependencies = ["zstandard>=0.22"]

[project.optional-dependencies]
# Kept so existing "handoff[zstd]" installs still work.
zstd = []
# Search by meaning as well as words; downloads the 90 MB all-MiniLM-L6-v2 model once.
meaning = ["fastembed>=0.4", "numpy>=1.24"]

[project.scripts]
threadline = "handoff:main"
handoff = "handoff:main"  # The name before Threadline; kept so existing setups keep working.

[tool.setuptools]
py-modules = ["handoff", "handoff_sessions", "handoff_capture", "handoff_decisions", "handoff_meaning", "handoff_agents"]
packages = ["handoff_web"]
package-data = { handoff_web = ["*.html", "*.js", "*.css", "*.json"] }

