[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff"
version = "0.3.0"
description = "Cross-harness coding-agent session handoff"
requires-python = ">=3.9"
# zstd compresses the journal and reads Codex's compressed history.
dependencies = ["zstandard>=0.22"]

[project.optional-dependencies]
# Kept so existing "handoff[zstd]" installs still work.
zstd = []
# Search by meaning as well as words; downloads the 90 MB all-MiniLM-L6-v2 model once.
meaning = ["fastembed>=0.4", "numpy>=1.24"]

[project.scripts]
handoff = "handoff:main"

[tool.setuptools]
py-modules = ["handoff", "handoff_sessions", "handoff_capture", "handoff_decisions", "handoff_typellm", "handoff_meaning"]

[dependency-groups]
dev = ["pytest>=8.0.0"]
